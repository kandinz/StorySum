name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Tạo GitHub Release (true/false)'
        required: false
        default: 'true'
        type: boolean

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cài đặt Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Lấy dependencies
        run: flutter pub get

      - name: Xác định Version và Tag
        id: version_info
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d '+' -f 1 | tr -d '\r\n ')
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v$VERSION"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "Building for Version: $VERSION with Tag: $TAG_NAME"

      - name: Build APK ARM64 Release
        run: |
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/StorySum-v${{ env.VERSION }}.apk

      - name: Lưu trữ APK vào Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StorySum-v${{ env.VERSION }}
          path: dist/StorySum-v${{ env.VERSION }}.apk
          retention-days: 14

      - name: Tạo GitHub Release và Upload APK
        if: github.ref_type == 'tag' || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release v${{ env.VERSION }}
          files: dist/StorySum-v${{ env.VERSION }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
